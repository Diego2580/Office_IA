<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AI Office - Agency</title>
    <style>
        body { background-color: #1e1e1e; color: #00ff00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #office-map { width: 950px; height: 350px; background-color: #2d2d2d; border: 2px solid #555; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .desk { width: 100px; height: 60px; background-color: #8b4513; position: absolute; border-radius: 5px; border: 2px solid #5a2c0c; }
        .agent { width: 40px; height: 40px; border-radius: 50%; position: absolute; text-align: center; line-height: 40px; color: white; font-weight: bold; transition: transform 0.3s; box-shadow: 0 4px 8px rgba(0,0,0,0.3); font-size: 12px; }
        #log-panel { width: 950px; height: 180px; background-color: #0c0c0c; margin-top: 15px; padding: 10px; overflow-y: auto; border: 1px solid #444; font-size: 14px; box-sizing: border-box; }
        #command-bar { width: 950px; display: flex; gap: 10px; margin-top: 10px; }
        input { flex: 1; padding: 12px; background: #0c0c0c; color: #00ff00; border: 1px solid #444; font-family: inherit; }
        button { padding: 12px 24px; background: #4285F4; color: white; border: none; font-weight: bold; cursor: pointer; }
        .status-badge { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 5px 10px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>
    <h2>AI Office - Agencia Completa</h2>
    <div id="office-map">
        <div id="connection-status" class="status-badge">Desconectado</div>
        <div class="desk" style="top: 150px; left: 50px;"></div><div class="agent" id="agente-ARQ" style="top: 100px; left: 80px; background: #4285F4;">ARQ</div>
        <div class="desk" style="top: 150px; left: 230px;"></div><div class="agent" id="agente-UI" style="top: 100px; left: 260px; background: #E91E63;">UI</div>
        <div class="desk" style="top: 150px; left: 410px;"></div><div class="agent" id="agente-DEV" style="top: 100px; left: 440px; background: #F4B400;">DEV</div>
        <div class="desk" style="top: 150px; left: 590px;"></div><div class="agent" id="agente-QA" style="top: 100px; left: 620px; background: #9C27B0;">QA</div>
        <div class="desk" style="top: 150px; left: 770px;"></div><div class="agent" id="agente-SEC" style="top: 100px; left: 800px; background: #F44336;">SEC</div>
    </div>
    <div id="log-panel"></div>
    <div id="command-bar">
        <input type="text" id="prompt-input" placeholder="Orden maestra..." autocomplete="off">
        <button id="btn-enviar">EJECUTAR</button>
    </div>
    <script>
        const logPanel = document.getElementById('log-panel'), inputPrompt = document.getElementById('prompt-input'), statusBadge = document.getElementById('connection-status');
        
        function log(msg, color="#00ff00") { logPanel.innerHTML += <div style="color:">> </div>; logPanel.scrollTop = logPanel.scrollHeight; }
        
        function conectarWS() {
            const ws = new WebSocket("ws://127.0.0.1:8000/ws/oficina");
            
            ws.onopen = () => {
                log("¡Conectado a la Agencia!", "#4285F4");
                statusBadge.innerText = "Conectado";
                statusBadge.style.background = "green";
            };
            
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.origen === "usuario") return;
                log([]:  - );
                let el = document.getElementById('agente-' + data.agente);
                if (el) { el.style.transform = "translateY(-20px)"; setTimeout(() => el.style.transform = "translateY(0)", 300); }
            };

            ws.onclose = () => {
                statusBadge.innerText = "Desconectado";
                statusBadge.style.background = "red";
                setTimeout(conectarWS, 3000); 
            };

            const enviar = () => {
                if(inputPrompt.value.trim()) {
                    log("TÚ: " + inputPrompt.value, "#fff");
                    ws.send(JSON.stringify({origen: "usuario", texto: inputPrompt.value}));
                    inputPrompt.value = "";
                }
            };
            document.getElementById('btn-enviar').onclick = enviar;
            inputPrompt.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };
        }
        conectarWS();
    </script>
</body>
</html>
